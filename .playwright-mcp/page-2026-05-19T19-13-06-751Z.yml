      - generic [ref=e130]:
        - paragraph [ref=e131]:
          - text: A native macOS app on top of a small set of local Swift packages.
          - strong [ref=e132]: No IPC, no Electron, no remote services.
        - paragraph [ref=e133]:
          - code [ref=e134]: App/
          - text: hosts the AppKit document app, editor, preview, menu, export, and window controllers.
          - code [ref=e135]: WritCore
          - text: handles document snapshots, revisions, hashes, render jobs, large-document mode, and technical-block models.
          - code [ref=e136]: WritParser
          - text: does Markdown parsing, math preprocessing, technical-block extraction, and HTML emission.
          - code [ref=e137]: WritRender
          - text: manages preview scheduling, technical-block caching, export helpers, and the bridge payloads.
        - paragraph [ref=e138]:
          - text: The editor is
          - code [ref=e139]: NSTextView
          - text: with TextKit 2 where practical. The preview is a
          - strong [ref=e140]:
            - text: persistent
            - code [ref=e141]: WKWebView
          - text: loaded once per document, then updated through a small JavaScript bridge —
          - code [ref=e142]: window.Writ.update(...)
          - text: . Parsing and preview scheduling run off the main thread so typing stays responsive.
        - paragraph [ref=e143]:
          - strong [ref=e144]: "Render pipeline:"
        - list [ref=e145]:
          - listitem [ref=e146]: User edits Markdown in the native text editor
          - listitem [ref=e147]: Debounce schedules a preview generation
          - listitem [ref=e148]: Markdown parsing runs off the main thread
          - listitem [ref=e149]: Technical blocks extracted (math, Mermaid, PlantUML, SVG/image, code)
          - listitem [ref=e150]: HTML emitted with stable block IDs for preview coordination
          - listitem [ref=e151]:
            - text: The existing
            - code [ref=e152]: WKWebView
            - text: receives an update payload via the bridge
          - listitem [ref=e153]: Bundled JS renders math, diagrams, and syntax highlighting
          - listitem [ref=e154]: Expensive renders cached by content hash; errors shown inline, never modal
